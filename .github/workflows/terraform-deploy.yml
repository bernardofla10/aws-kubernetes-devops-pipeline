name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - "terraform/environments/dev/**"
      - "terraform/modules/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.9"
  TF_WORKING_DIR: terraform/environments/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_cluster_admin_principal_arn: ${{ vars.TF_APPLY_ROLE_ARN }}
  TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Validate deployment variables
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "$TF_VAR_cluster_admin_principal_arn" ]]; then
            echo "Missing TF_APPLY_ROLE_ARN repository variable"
            exit 1
          fi

          if ! jq -e '
            type == "array" and
            length > 0 and
            all(.[]; type == "string" and test("^[0-9./]+$"))
          ' <<< "$TF_VAR_cluster_endpoint_public_access_cidrs" > /dev/null; then
            echo "EKS_PUBLIC_ACCESS_CIDRS must be a JSON array of IPv4 CIDRs"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -lock=false \
            -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-dev
          path: terraform/environments/dev/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform Apply
    needs:
      - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    environment:
      name: dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Download Terraform plan
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan-dev
          path: terraform/environments/dev

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
