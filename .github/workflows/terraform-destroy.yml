name: Terraform Destroy

run-name: Destroy dev infrastructure by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to confirm the infrastructure removal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  TF_WORKING_DIR: terraform/environments/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  destroy:
    name: Terraform Destroy
    if: ${{ inputs.confirmation == 'DESTROY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    environment:
      name: dev

    permissions:
      contents: read
      id-token: write

    env:
      # Required Terraform inputs. During destroy, the role ARN is only used to
      # evaluate the existing configuration; all managed resources are removed.
      TF_VAR_cluster_admin_principal_arn: ${{ vars.TF_APPLY_ROLE_ARN }}
      TF_VAR_cluster_endpoint_public_access_cidrs: '["127.0.0.1/32"]'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-destroy-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy \
            -input=false \
            -auto-approve \
            -lock-timeout=5m
